[project]
name = "fins-mpc-dual-model"
version = "0.1.0"
description = "Dual-model translation MPC for FineSUB and Unity integration"
requires-python = ">=3.10,<3.11"
dependencies = [
    "numpy>=1.24",
    "osqp>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
